{% extends 'base.html' %}
{% block title %}Create Post{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0 p-4">
            <h2 class="mb-3 text-center">Create a New Post 📝</h2>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 mt-3">Publish Post</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'post_list' %}" class="text-decoration-none">← Back to Homepage</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
